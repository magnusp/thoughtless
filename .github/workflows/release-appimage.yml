name: Release Linux AppImage

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_name:
        description: 'Release Title'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as Draft Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Compose Desktop App Distribution
        run: ./gradlew :desktopApp:createDistributable --no-daemon

      - name: Package AppImage
        run: |
          set -euo pipefail

          APP_DIR="AppDir"
          DIST_DIR="desktopApp/build/compose/binaries/main/app/github.magnusp.thoughtless"

          rm -rf "${APP_DIR}"
          mkdir -p "${APP_DIR}/usr"

          # Copy Compose distribution into AppDir/usr
          cp -r "${DIST_DIR}"/* "${APP_DIR}/usr/"

          # Ensure the binary is executable
          chmod +x "${APP_DIR}/usr/bin/github.magnusp.thoughtless"

          # Provide AppRun entrypoint
          cat << 'APPRUN' > "${APP_DIR}/AppRun"
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=$(dirname "$SELF")
          exec "${HERE}/usr/bin/github.magnusp.thoughtless" "$@"
          APPRUN
          chmod +x "${APP_DIR}/AppRun"

          # Create desktop entry
          cat << 'DESKTOP' > "${APP_DIR}/thoughtless.desktop"
          [Desktop Entry]
          Type=Application
          Name=Thoughtless
          Comment=Local-first Agentic Context Graph Engine
          Exec=github.magnusp.thoughtless
          Icon=thoughtless
          Categories=Office;Development;
          Terminal=false
          DESKTOP

          # Copy icon to root and standard icon location
          if [ -f "${APP_DIR}/usr/lib/github.magnusp.thoughtless.png" ]; then
            cp "${APP_DIR}/usr/lib/github.magnusp.thoughtless.png" "${APP_DIR}/thoughtless.png"
            mkdir -p "${APP_DIR}/usr/share/icons/hicolor/256x256/apps"
            cp "${APP_DIR}/usr/lib/github.magnusp.thoughtless.png" "${APP_DIR}/usr/share/icons/hicolor/256x256/apps/thoughtless.png"
          fi

          # Download appimagetool
          curl -sLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # Package AppImage (ARCH=x86_64 required for appimagetool, --appimage-extract-and-run for GitHub Actions runners)
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "${APP_DIR}" "Thoughtless-${{ inputs.tag_name }}-x86_64.AppImage"

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thoughtless-${{ inputs.tag_name }}-x86_64.AppImage
          path: Thoughtless-${{ inputs.tag_name }}-x86_64.AppImage
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: Thoughtless-${{ inputs.tag_name }}-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
